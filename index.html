<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Password Generator</h1>
            
            <div class="password-display">
                <input type="text" id="password" readonly placeholder="Your password will appear here">
                <button id="copy-btn" class="icon-btn" title="Copy to clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>

            <div class="strength-indicator">
                <span id="strength-text">Strength: <span class="strength-value">-</span></span>
                <div class="strength-bar">
                    <div class="strength-fill" id="strength-fill"></div>
                </div>
            </div>

            <div class="options">
                <div class="option-row">
                    <label for="length">Password Length</label>
                    <div class="length-control">
                        <input type="range" id="length-slider" min="4" max="64" value="16">
                        <input type="number" id="length" min="4" max="64" value="16">
                    </div>
                </div>

                <div class="option-row checkbox-row">
                    <label for="uppercase">
                        <input type="checkbox" id="uppercase" checked>
                        <span class="checkmark"></span>
                        Uppercase Letters (A-Z)
                    </label>
                </div>

                <div class="option-row checkbox-row">
                    <label for="lowercase">
                        <input type="checkbox" id="lowercase" checked>
                        <span class="checkmark"></span>
                        Lowercase Letters (a-z)
                    </label>
                </div>

                <div class="option-row checkbox-row">
                    <label for="numbers">
                        <input type="checkbox" id="numbers" checked>
                        <span class="checkmark"></span>
                        Numbers (0-9)
                    </label>
                </div>

                <div class="option-row checkbox-row">
                    <label for="symbols">
                        <input type="checkbox" id="symbols" checked>
                        <span class="checkmark"></span>
                        Special Symbols (!@#$%^&*)
                    </label>
                </div>
            </div>

            <button id="generate-btn" class="generate-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21h5v-5"></path></svg>
                Generate Password
            </button>
        </div>
    </div>

    <div id="toast" class="toast">Password copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
